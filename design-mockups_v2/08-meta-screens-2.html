<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>08 Meta Screens 2 — 残り 6 画面</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #050810;
    color: #e0ecf8;
    font-family: "Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Design canvas wrapper -->
<script type="text/babel" src="design-canvas.jsx"></script>

<!-- Reuse 06 data + shared primitives -->
<script type="text/babel" src="06-card-data.jsx"></script>
<script type="text/babel" src="06-shared.jsx"></script>

<!-- 08 screens -->
<script type="text/babel" src="08-setup.jsx"></script>
<script type="text/babel" src="08-result.jsx"></script>
<script type="text/babel" src="08-cards.jsx"></script>
<script type="text/babel" src="08-history.jsx"></script>
<script type="text/babel" src="08-tutorial.jsx"></script>
<script type="text/babel" src="08-settings.jsx"></script>

<script type="text/babel">
function MetaScreens2App() {
  return (
    <DesignCanvas>
      <DCSection
        id="play-flow"
        title="対戦フロー"
        subtitle="HOME から対戦終了まで · SETUP → MATCH(既存) → RESULT"
      >
        <DCArtboard id="setup"  label="A · 対戦準備 (単独捜査 / 観察ルーム)" width={1920} height={1080}>
          <SetupScreen />
        </DCArtboard>
        <DCArtboard id="result" label="B · 対戦結果 (勝利)" width={1920} height={1080}>
          <ResultScreen won />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="library"
        title="カード管理"
        subtitle="コレクション全体の閲覧と詳細"
      >
        <DCArtboard id="cards" label="C · カードリスト" width={1920} height={1080}>
          <CardsScreen />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="reference"
        title="参照 / 学習 / 設定"
        subtitle="履歴 · チュートリアル · 設定"
      >
        <DCArtboard id="history" label="D · 対戦履歴" width={1920} height={1080}>
          <HistoryScreen />
        </DCArtboard>
        <DCArtboard id="tutorial" label="E · チュートリアル" width={1920} height={1080}>
          <TutorialScreen />
        </DCArtboard>
        <DCArtboard id="settings" label="F · 設定" width={1920} height={1080}>
          <SettingsScreen />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<MetaScreens2App />);
</script>
</body>
</html>
