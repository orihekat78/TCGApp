<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>05 Effect Animations — コナンカードゲーム</title>
<style>
  :root {
    --bg-deep: #060a12;
    --bg-card: linear-gradient(180deg, rgba(20,32,48,0.6), rgba(8,12,20,0.6));
    --neon-blue: #4ec3ff;
    --neon-green: #44dd99;
    --neon-red: #ff5d5d;
    --neon-purple: #b48cff;
    --accent-gold: #ffd75e;
    --accent-conan-red: #c41818;
    --color-blue: #4a8ad8;
    --color-yellow: #e0b830;
    --color-red: #e05050;
    --text-primary: #f0f4f8;
    --text-secondary: #b8c4d0;
    --text-muted: #6a7785;
    --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --font-jp-serif: "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-display: "Trajan Pro", "Cinzel", serif;
    --font-mono: "JetBrains Mono", "Menlo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #050810;
    color: var(--text-primary);
    font-family: var(--font-jp);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1800px; margin: 0 auto;
    padding: 28px 36px 60px;
  }
  .page-header {
    display: flex; align-items: center; gap: 18px;
    border-bottom: 1px solid rgba(78,195,255,0.3);
    padding-bottom: 16px; margin-bottom: 24px;
  }
  .page-header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; }
  .page-header h1 strong {
    color: var(--accent-gold);
    margin-right: 6px;
    font-family: var(--font-mono);
  }
  .page-header .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .page-header .legend {
    margin-left: auto;
    display: flex;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
  }

  .page-intro {
    margin-bottom: 36px;
    padding: 14px 18px;
    border-left: 3px solid var(--accent-gold);
    background: rgba(255,215,94,0.05);
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.65;
    max-width: 1100px;
  }

  .scene-group {
    margin-bottom: 52px;
  }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(78,195,255,0.18);
  }
  .group-num {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.08em;
  }
  .group-titles h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .group-titles p {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .group-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  @media (max-width: 1280px) {
    .group-grid { grid-template-columns: 1fr; }
  }

  .scene-card {
    background: var(--bg-card);
    border: 1px solid rgba(78,195,255,0.25);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .scene-head {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(78,195,255,0.18);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.2);
  }
  .scene-head .num {
    color: var(--accent-gold);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 3px 7px;
    border: 1px solid rgba(255,215,94,0.4);
    border-radius: 3px;
  }
  .scene-titles { flex: 1; }
  .scene-titles h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .scene-titles .variant {
    font-size: 11px;
    color: var(--neon-blue);
    font-family: var(--font-mono);
  }
  .scene-head .dur {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .scene-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }

  .scene-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid rgba(78,195,255,0.12);
    background: rgba(0,0,0,0.2);
  }
  .scene-note {
    flex: 1;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .level-picker {
    display: flex;
    gap: 4px;
  }
  .lv-btn {
    padding: 4px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,215,94,0.3);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 120ms;
  }
  .lv-btn:hover {
    background: rgba(255,215,94,0.1);
    color: var(--accent-gold);
  }
  .lv-btn.active {
    background: var(--accent-gold);
    color: #0a0a0a;
    border-color: var(--accent-gold);
  }

  .scene-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.02) 0 12px,
        rgba(255,255,255,0.05) 12px 24px
      );
    color: var(--text-muted);
  }
  .scene-placeholder .ph-icon { font-size: 24px; color: rgba(255,215,94,0.4); }
  .scene-placeholder .ph-text { font-size: 12px; letter-spacing: 0.1em; }
  .scene-placeholder .ph-comp { font-family: var(--font-mono); font-size: 10.5px; color: rgba(78,195,255,0.5); }

  .page-footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid rgba(78,195,255,0.18);
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .page-footer code {
    font-family: var(--font-mono);
    background: rgba(78,195,255,0.1);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--neon-blue);
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared engine: Stage, Sprite, easing -->
  <script type="text/babel" src="animations.jsx"></script>

  <!-- Shared primitives -->
  <script type="text/babel" src="05-card.jsx"></script>
  <script type="text/babel" src="05-fx.jsx"></script>

  <!-- Scenes (each file exports scene components to window) -->
  <script type="text/babel" src="05-scenes-hirameki.jsx"></script>
  <script type="text/babel" src="05-scenes-contact.jsx"></script>
  <script type="text/babel" src="05-scenes-solution.jsx"></script>
  <script type="text/babel" src="05-scenes-misread.jsx"></script>
  <script type="text/babel" src="05-scenes-card.jsx"></script>
  <script type="text/babel" src="05-scenes-victory.jsx"></script>

  <!-- App orchestrator -->
  <script type="text/babel" src="05-app.jsx"></script>
</body>
</html>
