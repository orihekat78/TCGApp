<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>EvidenceArea — プロトタイププレビュー</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="stylesheet" href="EvidenceArea.css">

<style>
  :root {
    --bg-deep:        #0a1a28;
    --bg-cell:        rgba(0, 0, 0, 0.32);
    --border-zone:    #3a6ea5;
    --neon-blue:      #4ec3ff;
    --accent-gold:    #ffd700;
    --text-primary:   #e0ecf8;
    --text-secondary: #b8d4f0;
    --text-muted:     #7090b5;
    --text-disabled:  #4a5a70;
    --font-jp:   "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", -apple-system, sans-serif;
    --font-mono: "Cascadia Code", "Consolas", "Menlo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #15263e 0%, #0a1424 50%, #050a14 100%);
    color: var(--text-primary);
    font-family: var(--font-jp);
  }
  body { padding: 40px 28px 56px; }
  .page-title { font-size: 13px; letter-spacing: 0.18em; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
  .page-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 32px; max-width: 800px; line-height: 1.7; }
  .page-sub code { font-family: var(--font-mono); background: rgba(255,255,255,0.06); padding: 0 4px; border-radius: 2px; color: #ffd75e; }
  .demo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 32px 24px;
    max-width: 1080px;
  }
  .demo-cell { display: flex; flex-direction: column; gap: 8px; }
  .demo-label {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700;
    border-left: 2px solid var(--accent-gold); padding: 2px 0 2px 10px;
  }
  .demo-label small {
    display: block; margin-top: 4px;
    color: var(--text-disabled); letter-spacing: 0.04em;
    font-weight: 500; font-size: 10px; text-transform: none;
  }
  .evidence-host { width: 140px; }
</style>
</head>
<body>

<div class="page-title">EvidenceArea — Phase 7 静的表示プロトタイプ</div>
<p class="page-sub">
  プレイヤーの「証拠」ゾーン (裏向き card-back スタック + 必要証拠進捗) の検証。
  実プロジェクトでは <code>useEvidence()</code> から <code>{ count, requiredEvidence }</code>
  を渡してください。本フェーズではクリック展開モーダル未実装、
  <code>role="button"</code> と <code>aria-label</code> のみ付与しています。
</p>

<div id="root"></div>

<script type="text/babel" data-presets="typescript,react">
function EvidenceArea({ count, requiredEvidence, side }) {
  const safeCount = Math.max(0, count);
  const fillPct = Math.min(100, (safeCount / Math.max(1, requiredEvidence)) * 100);
  const isEmpty = safeCount === 0;
  const isComplete = safeCount >= requiredEvidence;
  return (
    <div
      className={`zone evidence-zone evidence-area side-${side}${isComplete ? ' complete' : ''}`}
      role="button"
      tabIndex={0}
      aria-label={`証拠 ${safeCount} / ${requiredEvidence} 枚`}
      data-side={side}
      data-count={safeCount}
    >
      <div className="zone-label">
        <span>証拠</span>
        <span className="count">{safeCount} / {requiredEvidence}</span>
      </div>
      <div className="stack-display evidence">
        {!isEmpty && (
          <>
            <div className="stack-shadow s3" aria-hidden="true"></div>
            <div className="stack-shadow s2" aria-hidden="true"></div>
            <div className="stack-shadow s1" aria-hidden="true"></div>
            <div className="card-back" aria-hidden="true">
              <div className="monogram">DC</div>
              <div className="magnifier"></div>
            </div>
          </>
        )}
        <div className="count-overlay">{safeCount}</div>
      </div>
      <div
        className="progress-track"
        role="progressbar"
        aria-valuemin={0}
        aria-valuemax={requiredEvidence}
        aria-valuenow={Math.min(safeCount, requiredEvidence)}
      >
        <div className="progress-fill" style={{ width: `${fillPct}%` }}></div>
      </div>
    </div>
  );
}

function App() {
  const cases = [
    { label: '0 / 7', sub: '空 — 推理未開始', count: 0, required: 7, side: 'self' },
    { label: '3 / 7', sub: '進捗中 — 約 43%',  count: 3, required: 7, side: 'self' },
    { label: '5 / 7', sub: 'mock の状態 — 71%', count: 5, required: 7, side: 'self' },
    { label: '7 / 7 ✦', sub: '完了 — 解決編で勝利可', count: 7, required: 7, side: 'self' },
    { label: '4 / 6', sub: '後攻側 — 約 67%', count: 4, required: 6, side: 'self' },
  ];
  return (
    <div className="demo-grid">
      {cases.map((c, i) => (
        <div className="demo-cell" key={i}>
          <div className="demo-label">
            {c.label}
            <small>{c.sub}</small>
          </div>
          <div className="evidence-host">
            <EvidenceArea count={c.count} requiredEvidence={c.required} side={c.side} />
          </div>
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
