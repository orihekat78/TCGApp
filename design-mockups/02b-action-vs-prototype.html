<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Action VS Prototype — コナンカードゲーム</title>
<style>
  :root {
    --bg-deep: #060a12;
    --neon-blue: #4ec3ff;
    --neon-green: #44dd99;
    --neon-red: #ff5d5d;
    --neon-gold: #ffd75e;
    --color-blue: #4a8ad8;
    --color-yellow: #e0b830;
    --color-red: #e05050;
    --text-primary: #f0f4f8;
    --text-secondary: #b8c4d0;
    --text-muted: #6a7785;
    --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --font-display: "Trajan Pro", "Cinzel", serif;
    --font-mono: "JetBrains Mono", "Menlo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--font-jp);
    color: var(--text-primary);
  }
  body { display: grid; place-items: center; }

  .stage { width: 1920px; height: 1080px; position: relative; transform-origin: center center; flex-shrink: 0; }

  /* Detective noir background */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(78,195,255,0.06), transparent 60%),
      linear-gradient(180deg, #0a1828 0%, #060c18 60%, #02060e 100%);
    z-index: -1;
  }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(rgba(78,195,255,0.04) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(78,195,255,0.04) 1px, transparent 1px) 0 0 / 24px 24px;
    opacity: 0.5;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,0.6) 90%);
  }

  /* ─── TopBar ─── */
  .topbar {
    position: absolute; left: 0; right: 0; top: 0; height: 44px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
    border-bottom: 1px solid rgba(78,195,255,0.3);
    z-index: 10;
  }
  .topbar .chap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #d8eeff; }
  .topbar .ring { width: 14px; height: 14px; border: 1.5px solid var(--neon-blue); border-radius: 50%; position: relative; }
  .topbar .ring::after { content: ""; position: absolute; inset: 3px; background: var(--neon-blue); border-radius: 50%; }
  .topbar .center { display: flex; gap: 18px; align-items: center; }
  .topbar .scratch { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); letter-spacing: 0.04em; }
  .topbar .scratch .dots { display: flex; gap: 3px; }
  .topbar .scratch .dots span { width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .topbar .scratch .dots span.on { background: var(--neon-gold); box-shadow: 0 0 6px var(--neon-gold); }
  .topbar .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 11px; }

  /* ─── Step indicator (left side) ─── */
  .step-rail {
    position: absolute; left: 24px; top: 80px; width: 240px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(78,195,255,0.3);
    border-radius: 4px;
    padding: 14px 16px;
    z-index: 8;
  }
  .step-rail h3 {
    font-size: 11px; letter-spacing: 0.18em; color: var(--text-muted);
    font-family: var(--font-mono); font-weight: 700; margin-bottom: 12px;
  }
  .step-rail h3 strong { color: var(--neon-gold); }
  .step-rail .step {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0; border-top: 1px dashed rgba(78,195,255,0.1);
    font-size: 12px; color: var(--text-muted);
    transition: color 0.2s;
  }
  .step-rail .step:first-of-type { border-top: 0; }
  .step-rail .step .n {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 11px;
    flex-shrink: 0;
  }
  .step-rail .step.done { color: var(--neon-green); }
  .step-rail .step.done .n { background: rgba(68,221,153,0.15); }
  .step-rail .step.active { color: var(--neon-gold); }
  .step-rail .step.active .n {
    background: rgba(255,215,94,0.2);
    box-shadow: 0 0 12px rgba(255,215,94,0.4);
  }
  .step-rail .step .label { flex: 1; line-height: 1.4; padding-top: 2px; }
  .step-rail .step .hint { font-size: 9px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.04em; }
  .step-rail .step.active .hint { color: rgba(255,215,94,0.7); }

  /* ─── Restart button ─── */
  .restart-btn {
    position: absolute; left: 24px; top: 470px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.7);
    border: 1.5px solid rgba(78,195,255,0.3);
    border-radius: 3px;
    color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  .restart-btn:hover { color: #fff; border-color: var(--neon-blue); }

  /* ─── Action menu (right side) ─── */
  .action-menu {
    position: absolute; right: 24px; top: 80px; width: 220px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(78,195,255,0.3);
    border-radius: 4px;
    padding: 12px;
    z-index: 8;
  }
  .action-menu h3 {
    font-size: 10px; letter-spacing: 0.18em; color: var(--text-muted);
    font-family: var(--font-mono); font-weight: 700; margin-bottom: 10px;
  }
  .action-item {
    display: flex; gap: 10px; align-items: center;
    padding: 7px 10px; border-radius: 3px;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: default;
  }
  .action-item.active {
    background: rgba(68,221,153,0.15);
    border-color: var(--neon-green);
    color: var(--neon-green);
    box-shadow: 0 0 12px rgba(68,221,153,0.25);
  }
  .action-item .num {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 11px;
    flex-shrink: 0;
  }
  .action-item.active .num { background: rgba(68,221,153,0.25); }

  /* ─── Scene rows ─── */
  .scene {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 1100px;
    display: flex; gap: 22px; justify-content: center;
  }
  .scene.opp { top: 130px; flex-direction: row-reverse; }
  .scene.self { top: 700px; }

  .scene .scene-label {
    position: absolute; left: -110px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-muted);
  }
  .scene.opp .scene-label { left: auto; right: -110px; }

  /* ─── Character card ─── */
  .char-card {
    width: 120px; height: 168px;
    border-radius: 5px;
    background: linear-gradient(160deg, #1a2638 0%, #0a1320 100%);
    border: 2px solid var(--color-blue);
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 16px rgba(74,138,216,0.3);
    display: flex; flex-direction: column;
    position: relative;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    overflow: visible;
  }
  .char-card.col-y { border-color: var(--color-yellow); box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 16px rgba(224,184,48,0.3); }
  .char-card.col-r { border-color: var(--color-red); box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 16px rgba(224,80,80,0.3); }
  .char-card.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.4); }
  .char-card.selected {
    transform: translateY(-12px) scale(1.05);
    box-shadow: 0 8px 32px rgba(78,195,255,0.5), 0 0 24px var(--neon-blue), inset 0 0 0 2px var(--neon-blue);
    border-color: var(--neon-blue);
  }
  .char-card.target-valid {
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 28px var(--neon-red), inset 0 0 0 2px var(--neon-red);
    animation: target-pulse 1s ease-in-out infinite;
  }
  @keyframes target-pulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 22px var(--neon-red), inset 0 0 0 2px var(--neon-red); }
    50% { box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 38px var(--neon-red), inset 0 0 0 2.5px var(--neon-red); }
  }
  .char-card.guard-glow {
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 24px var(--neon-gold), inset 0 0 0 2px var(--neon-gold);
    border-color: var(--neon-gold);
  }
  .char-card.defeated {
    animation: defeated 0.8s ease-out forwards;
    pointer-events: none;
  }
  @keyframes defeated {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(60px) rotate(-15deg); opacity: 0; }
  }

  .char-card .stripe { height: 9px; background: var(--color-blue); flex-shrink: 0; border-radius: 3px 3px 0 0; }
  .char-card.col-y .stripe { background: var(--color-yellow); }
  .char-card.col-r .stripe { background: var(--color-red); }
  .char-card .art {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(78,195,255,0.05), rgba(0,0,0,0.4));
    margin: 3px;
  }
  .char-card .sil {
    width: 65%; height: 65%;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.18), rgba(0,0,0,0.6));
    border-radius: 50% 50% 40% 40%;
  }
  .char-card .name {
    padding: 4px 4px; text-align: center; font-size: 10.5px; font-weight: 800;
    background: rgba(0,0,0,0.55);
    border-top: 1px solid rgba(255,255,255,0.06);
    min-height: 22px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1.15;
  }
  .char-card .stats {
    display: flex; padding: 4px; justify-content: space-around;
    background: rgba(0,0,0,0.7);
    font-family: var(--font-mono); font-weight: 800; font-size: 11.5px;
    border-radius: 0 0 3px 3px;
  }
  .char-card .lp { color: var(--neon-green); }
  .char-card .ap { color: #ff9b6e; }
  .char-card .lp.damaged { animation: dmg-flash 0.6s ease-out; }
  @keyframes dmg-flash {
    0%, 100% { color: var(--neon-green); transform: scale(1); }
    50% { color: var(--neon-red); transform: scale(1.5); text-shadow: 0 0 10px var(--neon-red); }
  }
  .char-card .ap-badge {
    position: absolute; top: -8px; right: -8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8060, #802820);
    border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px; font-weight: 900;
    box-shadow: 0 0 8px rgba(255,128,96,0.6);
  }
  .char-card.sleeping {
    transform: rotate(-90deg);
    /* Slot is wider to accommodate rotated state */
  }
  .char-card .status-badge {
    position: absolute; bottom: -6px; left: -6px;
    padding: 2px 6px;
    background: rgba(120,80,220,0.92);
    color: #fff;
    font-size: 9px; font-weight: 800;
    border-radius: 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  /* ─── Confirm Modal ─── */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .confirm-panel {
    background: linear-gradient(180deg, rgba(20,30,50,0.95), rgba(10,18,32,0.95));
    border: 1.5px solid var(--neon-blue);
    border-radius: 6px;
    padding: 26px 32px;
    width: 420px;
    text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 32px rgba(78,195,255,0.3);
    transform: scale(0.9);
    transition: transform 0.2s;
  }
  .modal-overlay.open .confirm-panel { transform: scale(1); }
  .confirm-panel .icon {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
    color: var(--neon-gold); margin-bottom: 10px;
  }
  .confirm-panel h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .confirm-panel .matchup {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 20px 0 24px;
  }
  .confirm-panel .vs-text {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 900; color: var(--neon-gold);
    text-shadow: 0 0 12px rgba(255,215,94,0.5);
  }
  .confirm-panel .mini-card {
    width: 90px; padding: 8px; border-radius: 4px;
    background: rgba(0,0,0,0.4);
    border: 1.5px solid currentColor;
  }
  .confirm-panel .mini-card .nm { font-size: 11px; font-weight: 800; text-align: center; margin-bottom: 4px; color: #fff; }
  .confirm-panel .mini-card .ap-line {
    font-family: var(--font-mono); font-size: 14px; font-weight: 800;
    text-align: center; color: #ff9b6e;
  }
  .confirm-panel .details {
    background: rgba(0,0,0,0.4);
    border-left: 3px solid var(--neon-blue);
    padding: 8px 12px;
    text-align: left;
    font-size: 12px; line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 22px;
  }
  .confirm-panel .details strong { color: #fff; }
  .confirm-panel .btn-row {
    display: flex; gap: 14px; justify-content: center;
  }
  .panel-btn {
    padding: 10px 28px;
    border-radius: 3px;
    border: 1.5px solid;
    font-family: var(--font-jp); font-size: 13px; font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .panel-btn.primary {
    background: linear-gradient(180deg, #3aa67a, #1f7a55);
    border-color: rgba(68,221,153,0.6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(46,166,121,0.4);
  }
  .panel-btn.primary:hover { box-shadow: 0 4px 16px rgba(46,166,121,0.7); transform: translateY(-1px); }
  .panel-btn.secondary {
    background: transparent;
    border-color: rgba(255,255,255,0.3);
    color: var(--text-secondary);
  }
  .panel-btn.secondary:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .panel-btn.danger {
    background: linear-gradient(180deg, #c84a4a, #7a2820);
    border-color: rgba(255,93,93,0.6);
    color: #fff;
  }

  /* ─── Cut-in prompt ─── */
  .cutin-panel { width: 600px; }
  .cutin-panel .ci-side-banner {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 2px;
    font-size: 10px; letter-spacing: 0.2em;
    font-family: var(--font-mono);
    margin-bottom: 4px;
  }
  .cutin-panel .ci-side-banner.self {
    background: rgba(68,221,153,0.18); color: var(--neon-green); border: 1px solid rgba(68,221,153,0.4);
  }
  .cutin-panel .ci-side-banner.opp {
    background: rgba(180,140,255,0.18); color: #b48cff; border: 1px solid rgba(180,140,255,0.4);
  }
  .cutin-panel .ci-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin: 14px 0 18px;
  }
  .cutin-panel .ci-col { text-align: center; }
  .cutin-panel .ci-card {
    width: 110px; margin: 0 auto 8px;
    padding: 8px 6px;
    background: rgba(0,0,0,0.45);
    border: 1.5px solid rgba(255,215,94,0.45);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cutin-panel .ci-card:hover {
    border-color: var(--neon-gold);
    box-shadow: 0 0 14px rgba(255,215,94,0.4);
    transform: translateY(-3px);
  }
  .cutin-panel .ci-card.played {
    border-color: var(--neon-gold);
    background: rgba(255,215,94,0.12);
    cursor: default;
    box-shadow: 0 0 20px rgba(255,215,94,0.5);
  }
  .cutin-panel .ci-card.played::after {
    content: "▶ 発動済 ◀"; display: block;
    font-size: 8.5px; font-family: var(--font-mono); color: var(--neon-gold);
    letter-spacing: 0.16em; margin-top: 4px;
  }
  .cutin-panel .ci-card .ci-tag {
    font-family: var(--font-mono); font-size: 8.5px;
    color: var(--neon-gold); letter-spacing: 0.16em;
    margin-bottom: 4px;
  }
  .cutin-panel .ci-card .nm { font-size: 11px; font-weight: 800; margin-bottom: 4px; color: #fff; }
  .cutin-panel .ci-card .fx {
    font-size: 10px; color: var(--text-secondary);
    padding: 4px 6px;
    background: rgba(255,215,94,0.08);
    border-left: 2px solid var(--neon-gold);
    text-align: left;
  }
  .cutin-panel .ci-pass {
    font-size: 10.5px; color: var(--text-muted);
    text-decoration: underline;
    cursor: pointer;
  }
  .cutin-panel .ci-pass:hover { color: var(--text-primary); }
  .cutin-panel .ci-status-summary {
    background: rgba(0,0,0,0.4);
    border-left: 3px solid var(--neon-gold);
    padding: 8px 12px;
    text-align: left;
    font-size: 11.5px; line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .cutin-panel .ci-status-summary strong { color: var(--neon-gold); font-family: var(--font-mono); }

  /* ─── Guard prompt ─── */
  .guard-panel { width: 480px; }
  .guard-panel .opp-banner {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(120,80,220,0.2);
    border: 1px solid rgba(180,140,255,0.5);
    color: var(--neon-blue);
    font-size: 10px; letter-spacing: 0.2em;
    font-family: var(--font-mono);
    border-radius: 2px;
    margin-bottom: 10px;
  }
  .guard-panel .guard-options {
    display: flex; gap: 12px; justify-content: center;
    margin: 18px 0 22px;
  }
  .guard-panel .guard-opt {
    width: 100px; padding: 8px;
    background: rgba(0,0,0,0.4);
    border: 1.5px solid rgba(255,215,94,0.3);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .guard-panel .guard-opt:hover {
    border-color: var(--neon-gold);
    box-shadow: 0 0 16px rgba(255,215,94,0.4);
    transform: translateY(-3px);
  }
  .guard-panel .guard-opt.no-guard {
    border-color: rgba(255,255,255,0.2);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    height: auto;
  }
  .guard-panel .guard-opt .nm { font-size: 11px; font-weight: 800; text-align: center; margin: 4px 0; }
  .guard-panel .guard-opt .ap-line { font-family: var(--font-mono); font-size: 12px; text-align: center; color: #ff9b6e; }
  .guard-panel .timer-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .guard-panel .timer-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-gold), #ff9b6e);
    animation: timer 8s linear forwards;
  }
  @keyframes timer { from { width: 100%; } to { width: 0%; } }

  /* ─── VS Animation overlay ─── */
  .vs-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    background: radial-gradient(ellipse at 50% 50%, rgba(40,15,15,0.7), rgba(0,0,0,0.95));
    opacity: 0; pointer-events: none;
  }
  .vs-overlay.playing { opacity: 1; pointer-events: auto; animation: vs-overlay-in 0.3s ease-out forwards; }
  @keyframes vs-overlay-in {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  .vs-overlay::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,215,94,0.5), transparent);
    transform: translateY(-1px) scaleX(0);
  }
  .vs-overlay.playing::before { animation: vs-line 1.4s ease-out forwards; }
  @keyframes vs-line {
    0% { transform: translateY(-1px) scaleX(0); }
    40% { transform: translateY(-1px) scaleX(1); }
  }
  .vs-shockwave {
    position: absolute; left: 50%; top: 50%;
    border: 3px solid var(--neon-gold);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  .vs-overlay.playing .vs-shockwave { animation: vs-shock 0.7s ease-out 0.4s forwards; }
  @keyframes vs-shock {
    0% { width: 40px; height: 40px; opacity: 1; border-width: 6px; }
    100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
  }
  .vs-card-l, .vs-card-r {
    width: 200px; height: 280px;
    border-radius: 6px;
    background: linear-gradient(160deg, #1a2638 0%, #0a1320 100%);
    border: 2px solid var(--color-blue);
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    position: relative;
    transform: translateX(-500px);
    opacity: 0;
  }
  .vs-card-r { transform: translateX(500px); }
  .vs-overlay.playing .vs-card-l { animation: vs-slide-l 1.4s cubic-bezier(.2,1.2,.4,1) forwards; }
  .vs-overlay.playing .vs-card-r { animation: vs-slide-r 1.4s cubic-bezier(.2,1.2,.4,1) forwards; }
  @keyframes vs-slide-l {
    0% { transform: translateX(-500px) rotate(-12deg); opacity: 0; }
    35% { transform: translateX(0) rotate(-4deg); opacity: 1; }
    50% { transform: translateX(20px) rotate(-2deg); }
    100% { transform: translateX(0) rotate(0); opacity: 1; }
  }
  @keyframes vs-slide-r {
    0% { transform: translateX(500px) rotate(12deg); opacity: 0; }
    35% { transform: translateX(0) rotate(4deg); opacity: 1; }
    50% { transform: translateX(-20px) rotate(2deg); }
    100% { transform: translateX(0) rotate(0); opacity: 1; }
  }
  .vs-card-r.col-y { border-color: var(--color-yellow); }
  .vs-card-l .stripe, .vs-card-r .stripe { height: 12px; background: var(--color-blue); border-radius: 3px 3px 0 0; }
  .vs-card-r.col-y .stripe { background: var(--color-yellow); }
  .vs-card-l .art, .vs-card-r .art {
    flex: 1; display: flex; align-items: center; justify-content: center;
    margin: 4px;
    background: linear-gradient(180deg, rgba(78,195,255,0.06), rgba(0,0,0,0.4));
  }
  .vs-card-l .sil, .vs-card-r .sil {
    width: 60%; height: 65%;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.2), rgba(0,0,0,0.6));
    border-radius: 50% 50% 40% 40%;
  }
  .vs-card-l .nm, .vs-card-r .nm {
    background: rgba(0,0,0,0.55);
    padding: 6px; text-align: center;
    font-size: 13px; font-weight: 800;
  }
  .vs-card-l .ap-big, .vs-card-r .ap-big {
    position: absolute; top: -16px;
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8060, #802820);
    border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 24px; font-weight: 900;
    box-shadow: 0 0 16px rgba(255,128,96,0.7);
    opacity: 0;
    transform: scale(0);
  }
  .vs-card-l .ap-big { left: -16px; }
  .vs-card-r .ap-big { right: -16px; }
  .vs-overlay.playing .vs-card-l .ap-big { animation: ap-pop 0.4s cubic-bezier(.2,1.6,.4,1) 0.9s forwards; }
  .vs-overlay.playing .vs-card-r .ap-big { animation: ap-pop 0.4s cubic-bezier(.2,1.6,.4,1) 1.0s forwards; }
  @keyframes ap-pop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .vs-arena {
    display: flex; align-items: center; justify-content: center;
    gap: 80px;
    position: relative;
  }
  .vs-banner {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(3) skewX(-30deg);
    font-family: var(--font-display); font-size: 120px; font-weight: 900;
    color: var(--neon-gold);
    text-shadow: 0 0 32px rgba(255,215,94,0.8), 0 0 64px rgba(255,150,40,0.5);
    letter-spacing: 0.2em;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  .vs-overlay.playing .vs-banner { animation: vs-banner 1s cubic-bezier(.2,1.4,.4,1) 0.4s forwards; }
  @keyframes vs-banner {
    0% { transform: translate(-50%, -50%) scale(3) skewX(-30deg); opacity: 0; letter-spacing: 0.5em; }
    40% { transform: translate(-50%, -50%) scale(1.2) skewX(-8deg); opacity: 1; letter-spacing: 0.2em; }
    100% { transform: translate(-50%, -50%) scale(1) skewX(-8deg); opacity: 1; }
  }
  .vs-result {
    position: absolute; left: 50%; top: 75%;
    transform: translateX(-50%) translateY(20px);
    padding: 14px 36px;
    background: rgba(0,0,0,0.8);
    border: 1.5px solid;
    border-radius: 4px;
    font-size: 18px; font-weight: 800; letter-spacing: 0.15em;
    opacity: 0;
  }
  .vs-result.win { color: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 24px rgba(68,221,153,0.5); }
  .vs-result.lose { color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 24px rgba(255,93,93,0.5); }
  .vs-result.draw { color: var(--neon-blue); border-color: var(--neon-blue); box-shadow: 0 0 24px rgba(78,195,255,0.5); }
  .vs-overlay.playing .vs-result { animation: vs-result 0.5s ease-out 1.5s forwards; }
  @keyframes vs-result {
    0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
    100% { transform: translateX(-50%) translateY(0); opacity: 1; }
  }

  /* ─── Resolution toast ─── */
  .toast {
    position: absolute; left: 50%; top: 60%;
    transform: translateX(-50%);
    padding: 14px 28px;
    background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.78));
    border: 1.5px solid var(--neon-blue);
    border-radius: 4px;
    font-size: 14px; letter-spacing: 0.08em;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(78,195,255,0.3);
    z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    min-width: 360px; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  .toast .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--neon-gold); margin-bottom: 6px; }

  /* ─── Bottom narrator ─── */
  .narrator {
    position: absolute; left: 24px; right: 24px; bottom: 24px;
    height: 50px;
    background: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(0,0,0,0.5));
    border: 1px solid rgba(78,195,255,0.3);
    border-left: 4px solid var(--neon-blue);
    border-radius: 0 4px 4px 0;
    padding: 0 22px;
    display: flex; align-items: center; gap: 14px;
    z-index: 10;
  }
  .narrator .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #b88, #6a3a3a 70%);
    border: 2px solid var(--neon-blue);
    flex-shrink: 0;
  }
  .narrator .text { font-size: 14px; color: var(--text-primary); letter-spacing: 0.04em; }
  .narrator .text em { color: var(--neon-gold); font-style: normal; font-weight: 700; }

</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Card definitions ───
const initialState = {
  self: {
    label: "自分 (CT-D11)",
    chars: [
      { id: "s1", name: "服部 平次", lp: 2, ap: 3, color: "" },
      { id: "s2", name: "遠山 和葉", lp: 1, ap: 2, color: "col-y" },
      { id: "s3", name: "毛利 蘭",  lp: 2, ap: 2, color: "col-y" },
    ],
  },
  opp: {
    label: "相手 (CT-D08)",
    chars: [
      { id: "o1", name: "怪盗キッド", lp: 2, ap: 3, color: "" },
      { id: "o2", name: "鈴木 園子",  lp: 1, ap: 1, color: "" },
      { id: "o3", name: "白馬 探",    lp: 2, ap: 2, color: "" },
    ],
  },
};

// ─── Steps definition for the rail ───
const STEPS = [
  { id: "select-attacker", label: "アタッカーを選ぶ", hint: "自分の現場から" },
  { id: "select-target",   label: "ターゲットを選ぶ", hint: "赤く光る相手から" },
  { id: "confirm",         label: "アクション確認",   hint: "①対象選択 / ②AP判定" },
  { id: "guard",           label: "ガード判定",       hint: "相手の選択待ち" },
  { id: "cutin",           label: "カットイン受付",   hint: "両者AP±/効果" },
  { id: "vs",              label: "コンタクトVS",     hint: "AP比較演出" },
  { id: "resolve",         label: "結果適用",         hint: "LP減算 → 戻る" },
];

// ─── CharCard component ───
function CharCard({ char, mode, onClick, refCb }) {
  const cls = [
    "char-card",
    char.color,
    char.dead && "defeated",
    mode === "selected" && "selected",
    mode === "target" && "target-valid",
    mode === "guard" && "guard-glow",
    mode === "disabled" && "disabled",
  ].filter(Boolean).join(" ");
  return (
    <div className={cls} onClick={onClick} ref={refCb}>
      <div className="ap-badge">{char.ap}</div>
      <div className="stripe"></div>
      <div className="art"><div className="sil"></div></div>
      <div className="name">{char.name}</div>
      <div className="stats">
        <span className={"lp" + (char.justDamaged ? " damaged" : "")}>LP {char.lp}</span>
        <span className="ap">AP {char.ap}</span>
      </div>
    </div>
  );
}

// ─── Main app ───
function App() {
  // State machine
  const [phase, setPhase] = useState("idle"); // idle, select-target, confirm, guard, cutin, vs, resolve
  const [state, setState] = useState(initialState);
  const [attackerId, setAttackerId] = useState(null);
  const [targetId, setTargetId] = useState(null);
  const [guardId, setGuardId] = useState(null); // who guards (null = no guard)
  const [vsResult, setVsResult] = useState(null); // 'win' | 'lose' | 'draw'
  const [toast, setToast] = useState(null);
  const [apMod, setApMod] = useState({ self: 0, opp: 0 });
  const [cutInUsed, setCutInUsed] = useState({ self: null, opp: null });

  // Derived
  const attacker = state.self.chars.find(c => c.id === attackerId);
  const target = state.opp.chars.find(c => c.id === targetId);
  const guard = guardId ? state.opp.chars.find(c => c.id === guardId) : null;
  const defender = guard || target;

  const currentStepIdx = {
    idle: 0,
    "select-target": 1,
    confirm: 2,
    guard: 3,
    cutin: 4,
    vs: 5,
    resolve: 6,
  }[phase];

  // ─── Handlers ───
  const onSelfClick = (id) => {
    if (phase !== "idle" && phase !== "select-target") return;
    const c = state.self.chars.find(x => x.id === id);
    if (!c || c.dead) return;
    setAttackerId(id);
    setTargetId(null);
    setPhase("select-target");
  };

  const onOppClick = (id) => {
    if (phase !== "select-target") return;
    const c = state.opp.chars.find(x => x.id === id);
    if (!c || c.dead) return;
    setTargetId(id);
    setPhase("confirm");
  };

  const cancelAction = () => {
    setAttackerId(null);
    setTargetId(null);
    setGuardId(null);
    setApMod({ self: 0, opp: 0 });
    setCutInUsed({ self: null, opp: null });
    setPhase("idle");
  };

  const confirmAttack = () => {
    setPhase("guard");
  };

  const chooseGuard = (id) => {
    setGuardId(id);
    setPhase("cutin");
  };

  const skipGuard = () => {
    setGuardId(null);
    setPhase("cutin");
  };

  // Cut-in handlers
  const playCutInSelf = () => {
    setApMod(m => ({ ...m, self: m.self + 2 }));
    setCutInUsed(u => ({ ...u, self: "推理の閃光 (+AP 2)" }));
  };
  const playCutInOpp = () => {
    setApMod(m => ({ ...m, opp: m.opp + 1 }));
    setCutInUsed(u => ({ ...u, opp: "現場保存 (+AP 1)" }));
  };
  const proceedToVs = () => setPhase("vs");

  // ─── VS animation completion ───
  useEffect(() => {
    if (phase !== "vs") return;
    // Compute result (with cut-in AP modifiers)
    const a = attacker.ap + apMod.self;
    const d = defender.ap + apMod.opp;
    let result;
    if (a > d) result = "win";
    else if (a < d) result = "lose";
    else result = "draw";
    setVsResult(result);
    // After 2.2s, apply result
    const t = setTimeout(() => {
      applyResolution(result);
    }, 2200);
    return () => clearTimeout(t);
  }, [phase]);

  const applyResolution = (result) => {
    setState(prev => {
      const ns = JSON.parse(JSON.stringify(prev));
      const aChar = ns.self.chars.find(x => x.id === attackerId);
      const dCharId = guardId || targetId;
      const dChar = ns.opp.chars.find(x => x.id === dCharId);
      if (result === "win") {
        dChar.lp -= 1;
        dChar.justDamaged = true;
        if (dChar.lp <= 0) dChar.dead = true;
      } else if (result === "lose") {
        aChar.lp -= 1;
        aChar.justDamaged = true;
        if (aChar.lp <= 0) aChar.dead = true;
      }
      return ns;
    });
    setPhase("resolve");
    // Build toast message
    let msg;
    if (result === "win") {
      msg = { label: "WIN", text: `${attacker.name} が ${defender.name} に1ダメージ` };
    } else if (result === "lose") {
      msg = { label: "LOSE", text: `${defender.name} の反撃で ${attacker.name} が1ダメージ` };
    } else {
      msg = { label: "DRAW", text: "AP同値 — お互いダメージなし" };
    }
    setToast(msg);
    // Clear after 2.5s
    setTimeout(() => {
      setToast(null);
      // clear justDamaged
      setState(prev => {
        const ns = JSON.parse(JSON.stringify(prev));
        ns.self.chars.forEach(c => delete c.justDamaged);
        ns.opp.chars.forEach(c => delete c.justDamaged);
        return ns;
      });
      cancelAction();
    }, 2800);
  };

  const restart = () => {
    setState(JSON.parse(JSON.stringify(initialState)));
    cancelAction();
    setToast(null);
  };

  // ─── Narrator text ───
  let narrator;
  switch (phase) {
    case "idle":
      narrator = <span>自分の現場から <em>アタッカーを選択</em> してください。</span>; break;
    case "select-target":
      narrator = <span><em>{attacker?.name}</em> でコンタクトする — 赤く光る相手キャラを選択。</span>; break;
    case "confirm":
      narrator = <span><em>{attacker?.name}</em> vs <em>{target?.name}</em> — 内容を確認して「実行」。</span>; break;
    case "guard":
      narrator = <span>相手はガード可能 — <em>ガードキャラ</em> もしくは「ガードなし」を選択中…</span>; break;
    case "cutin":
      narrator = <span><em>カットイン受付</em> — 両プレイヤーは手札からカットインを発動できます。APに修正が入ることがあります。</span>; break;
    case "vs":
      narrator = <span>コンタクトVS 演出中…</span>; break;
    case "resolve":
      narrator = <span>解決中 — 結果を盤面に反映</span>; break;
    default: narrator = null;
  }

  // ─── Self/Opp render with mode flags ───
  const selfChars = state.self.chars.map(c => {
    let mode = "default";
    if (c.dead) mode = "default";
    else if (c.id === attackerId) mode = "selected";
    else if (phase === "select-target" && c.id !== attackerId) mode = "disabled";
    return { ...c, mode };
  });
  const oppChars = state.opp.chars.map(c => {
    let mode = "default";
    if (c.dead) mode = "default";
    else if (phase === "select-target") mode = "target";
    else if (phase === "confirm" && c.id === targetId) mode = "target";
    else if (phase === "guard" && c.id === targetId) mode = "target";
    else if (phase === "guard" && c.id === guardId) mode = "guard";
    return { ...c, mode };
  });

  return (
    <div className="stage" id="stage">
      <div className="bg"></div>

      <div className="topbar">
        <div className="chap"><span className="ring"></span><span>後攻 4ターン目 / メインフェイズ</span></div>
        <div className="center">
          <div className="scratch"><span>痕跡 自</span><span className="dots"><span className="on"></span><span className="on"></span><span></span></span></div>
          <div className="scratch"><span>相</span><span className="dots"><span className="on"></span><span></span><span></span></span></div>
        </div>
        <div className="right"><span>ナレーター</span></div>
      </div>

      {/* Step rail */}
      <div className="step-rail">
        <h3>ACTION FLOW · <strong>STEP {currentStepIdx + 1}/{STEPS.length}</strong></h3>
        {STEPS.map((s, i) => {
          let cls = "step";
          if (i < currentStepIdx) cls += " done";
          else if (i === currentStepIdx) cls += " active";
          return (
            <div key={s.id} className={cls}>
              <div className="n">{i < currentStepIdx ? "✓" : i + 1}</div>
              <div>
                <div className="label">{s.label}</div>
                <div className="hint">{s.hint}</div>
              </div>
            </div>
          );
        })}
      </div>
      <button className="restart-btn" onClick={restart}>↻ リセット</button>

      {/* Action menu */}
      <div className="action-menu">
        <h3>ACTION MENU</h3>
        <div className="action-item"><span className="num">①</span><span>カードを出す</span></div>
        <div className="action-item"><span className="num">②</span><span>キャラ移動</span></div>
        <div className="action-item"><span className="num">③</span><span>パートナーで推理</span></div>
        <div className="action-item"><span className="num">④</span><span>ヒラメキ使用</span></div>
        <div className="action-item"><span className="num">⑤</span><span>イベント使用</span></div>
        <div className="action-item active"><span className="num">⑥</span><span>コンタクト</span></div>
      </div>

      {/* Opp scene */}
      <div className="scene opp">
        <div className="scene-label">相手 現場</div>
        {oppChars.map(c => (
          <CharCard key={c.id} char={c} mode={c.mode}
            onClick={() => onOppClick(c.id)} />
        ))}
      </div>

      {/* Self scene */}
      <div className="scene self">
        <div className="scene-label">自分 現場</div>
        {selfChars.map(c => (
          <CharCard key={c.id} char={c} mode={c.mode}
            onClick={() => onSelfClick(c.id)} />
        ))}
      </div>

      {/* Confirm modal */}
      <div className={"modal-overlay" + (phase === "confirm" ? " open" : "")}>
        <div className="confirm-panel">
          <div className="icon">⚔ ACTION CONFIRM</div>
          <h2>コンタクトを実行しますか？</h2>
          {attacker && target && (
            <div className="matchup">
              <div className="mini-card" style={{borderColor: attacker.color === "col-y" ? "#e0b830" : "#4a8ad8"}}>
                <div className="nm">{attacker.name}</div>
                <div className="ap-line">AP {attacker.ap}</div>
              </div>
              <div className="vs-text">VS</div>
              <div className="mini-card" style={{borderColor: target.color === "col-y" ? "#e0b830" : "#4a8ad8"}}>
                <div className="nm">{target.name}</div>
                <div className="ap-line">AP {target.ap}</div>
              </div>
            </div>
          )}
          <div className="details">
            <div>• 痕跡 <strong>1個</strong> を消費</div>
            <div>• 相手はガードを宣言できます</div>
            <div>• AP比較で勝者が <strong>1ダメージ</strong> を与える</div>
          </div>
          <div className="btn-row">
            <button className="panel-btn secondary" onClick={cancelAction}>戻る</button>
            <button className="panel-btn primary" onClick={confirmAttack}>実行する →</button>
          </div>
        </div>
      </div>

      {/* Guard prompt */}
      <div className={"modal-overlay" + (phase === "guard" ? " open" : "")}>
        <div className="confirm-panel guard-panel">
          <div className="opp-banner">▼ OPPONENT TURN ▼</div>
          <h2>ガードを宣言しますか？</h2>
          <p style={{fontSize:12, color:"var(--text-secondary)", marginTop:6}}>
            <em style={{color:"#ffd75e",fontStyle:"normal"}}>{attacker?.name}</em> の AP {attacker?.ap} 攻撃 — ガード役を選択
          </p>
          <div className="timer-bar"><div className="fill"></div></div>
          <div className="guard-options">
            {target && (
              <div className="guard-opt" onClick={skipGuard} style={{borderColor: target.color === "col-y" ? "#e0b830" : "#4a8ad8"}}>
                <div className="nm">{target.name}<br/><span style={{fontSize:9,color:"#6a7785"}}>(対象本人)</span></div>
                <div className="ap-line">AP {target.ap}</div>
              </div>
            )}
            {state.opp.chars.filter(c => c.id !== targetId && !c.dead).map(c => (
              <div key={c.id} className="guard-opt" onClick={() => chooseGuard(c.id)}
                   style={{borderColor: c.color === "col-y" ? "#e0b830" : "#4a8ad8"}}>
                <div className="nm">{c.name}<br/><span style={{fontSize:9,color:"#6a7785"}}>(ガード)</span></div>
                <div className="ap-line">AP {c.ap}</div>
              </div>
            ))}
          </div>
          <div className="btn-row">
            <button className="panel-btn secondary" onClick={cancelAction}>キャンセル(検証用)</button>
          </div>
        </div>
      </div>

      {/* Cut-in prompt */}
      <div className={"modal-overlay" + (phase === "cutin" ? " open" : "")}>
        <div className="confirm-panel cutin-panel">
          <div className="icon">⚡ CUT-IN WINDOW ・ カットイン受付</div>
          <h2>両プレイヤーは手札からカットインを発動できます</h2>
          <p style={{fontSize:11, color:"var(--text-muted)", marginTop:4, letterSpacing:"0.06em"}}>※ 期間中に AP 修正・効果を適用するカードを互いに使えます。使用したカードはリムーブされます。</p>

          <div className="ci-row">
            <div className="ci-col">
              <span className="ci-side-banner self">▸ あなた / SELF</span>
              <div className={"ci-card" + (cutInUsed.self ? " played" : "")}
                   onClick={cutInUsed.self ? undefined : playCutInSelf}>
                <div className="ci-tag">CUT-IN</div>
                <div className="nm">推理の闃光</div>
                <div className="fx">このコンタクト中、自分の AP +2</div>
              </div>
              {!cutInUsed.self && <span className="ci-pass" onClick={() => setCutInUsed(u => ({...u, self: "pass"}))}>パスする</span>}
              {cutInUsed.self === "pass" && <span style={{fontSize:10.5,color:"var(--text-muted)"}}>(パス)</span>}
            </div>
            <div className="ci-col">
              <span className="ci-side-banner opp">▸ 相手 / OPP</span>
              <div className={"ci-card" + (cutInUsed.opp ? " played" : "")}
                   onClick={cutInUsed.opp ? undefined : playCutInOpp}>
                <div className="ci-tag">CUT-IN</div>
                <div className="nm">現場保存</div>
                <div className="fx">このコンタクト中、自分の AP +1</div>
              </div>
              {!cutInUsed.opp && <span className="ci-pass" onClick={() => setCutInUsed(u => ({...u, opp: "pass"}))}>パスする</span>}
              {cutInUsed.opp === "pass" && <span style={{fontSize:10.5,color:"var(--text-muted)"}}>(パス)</span>}
            </div>
          </div>

          <div className="ci-status-summary">
            <div>・ あなた · AP {attacker?.ap} {apMod.self > 0 && <strong>(+{apMod.self})</strong>} = {(attacker?.ap || 0) + apMod.self}</div>
            <div>・ 相手 · AP {defender?.ap} {apMod.opp > 0 && <strong>(+{apMod.opp})</strong>} = {(defender?.ap || 0) + apMod.opp}</div>
          </div>

          <div className="btn-row">
            <button className="panel-btn secondary" onClick={cancelAction}>中断</button>
            <button className="panel-btn primary" onClick={proceedToVs} disabled={!cutInUsed.self || !cutInUsed.opp}
                    style={(!cutInUsed.self || !cutInUsed.opp) ? {opacity:0.4, cursor:"not-allowed"} : {}}>
              VS 判定へ →
            </button>
          </div>
        </div>
      </div>

      {/* VS overlay */}
      {phase === "vs" && attacker && defender && (
        <div className="vs-overlay playing">
          <div className="vs-shockwave"></div>
          <div className="vs-arena">
            <div className={"vs-card-l " + (attacker.color || "")}>
              <div className="ap-big">{attacker.ap + apMod.self}{apMod.self > 0 && <span style={{fontSize:11,color:"#ffea60",marginLeft:2}}>+{apMod.self}</span>}</div>
              <div className="stripe"></div>
              <div className="art"><div className="sil"></div></div>
              <div className="nm">{attacker.name}</div>
            </div>
            <div className={"vs-card-r " + (defender.color || "")}>
              <div className="ap-big">{defender.ap + apMod.opp}{apMod.opp > 0 && <span style={{fontSize:11,color:"#ffea60",marginLeft:2}}>+{apMod.opp}</span>}</div>
              <div className="stripe"></div>
              <div className="art"><div className="sil"></div></div>
              <div className="nm">{defender.name}{guardId ? " (ガード)" : ""}</div>
            </div>
            <div className="vs-banner">VS</div>
            {vsResult && (
              <div className={"vs-result " + vsResult}>
                {vsResult === "win" ? "YOU WIN · AP " + (attacker.ap + apMod.self) + " > " + (defender.ap + apMod.opp)
                  : vsResult === "lose" ? "YOU LOSE · AP " + (attacker.ap + apMod.self) + " < " + (defender.ap + apMod.opp)
                  : "DRAW · AP " + (attacker.ap + apMod.self) + " = " + (defender.ap + apMod.opp)}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Resolution toast */}
      <div className={"toast" + (toast ? " show" : "")}>
        {toast && (
          <>
            <div className="label">{toast.label}</div>
            <div>{toast.text}</div>
          </>
        )}
      </div>

      {/* Narrator */}
      <div className="narrator">
        <div className="avatar"></div>
        <div className="text">{narrator}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// ─── Auto-scale stage to viewport ───
function fitStage() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = "scale(" + scale + ")";
}
window.addEventListener("resize", fitStage);
setTimeout(fitStage, 50);
</script>
</body>
</html>
