<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATCH mobile reviewed mock</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020912; }
    img { position: absolute; inset: 0; width: 851px; height: 393px; display: block; }
    .presentation-skip {
      position: absolute; left: 8px; top: 219px; width: 94px; height: 44px;
      display: grid; place-items: center; border: 1px solid #2d789c; border-radius: 4px;
      background: #06243a; color: #f4fbff; font: 700 10px/1.25 "Yu Gothic UI", Meiryo, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <img id="base" alt="デスクトップと同じプレイマットを等比縮小したMATCH">
  <button class="presentation-skip" type="button" aria-label="演出をスキップ">演出を<br>スキップ</button>
  <script>
    const target = new URLSearchParams(location.search).get('state') === 'target';
    document.getElementById('base').src = target
      ? 'match-mobile-851x393-uniform-canvas-target-selection.png'
      : 'match-mobile-851x393-uniform-canvas-resolution.png';
  </script>
</body>
</html>
