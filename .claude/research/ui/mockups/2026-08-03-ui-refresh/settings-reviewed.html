<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SETTINGS reviewed mock</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eff6fb;
        --muted: #91a5b6;
        --line: rgba(130, 169, 198, .25);
        --line-strong: rgba(82, 188, 235, .58);
        --canvas: #04111d;
        --panel: #081b2b;
        --panel-deep: #061522;
        --cyan: #5ad8ff;
        --cyan-deep: #0a668d;
        font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; background: var(--canvas); }
      body { color: var(--ink); background: linear-gradient(180deg, #071827 0, var(--canvas) 46%, #030c15 100%); }
      button, input { font: inherit; }

      .site-header {
        height: 72px; display: flex; align-items: stretch; padding: 0 28px;
        border-bottom: 1px solid var(--line); background: rgba(2, 12, 22, .95);
      }
      .brand { width: 251px; display: flex; align-items: center; flex: 0 0 auto; }
      .brand img { display: block; width: 192px; height: 42px; object-fit: contain; filter: brightness(0) invert(1); }
      .nav { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(88px, 1fr)); }
      .nav a {
        min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
        border-left: 1px solid rgba(130, 169, 198, .14); color: #d7e4ee; text-decoration: none;
        font-size: 14px; font-weight: 700; white-space: nowrap;
      }
      .nav a:last-child { border-right: 1px solid rgba(130, 169, 198, .14); }
      .nav-icon { color: #b5c8d7; font-size: 16px; line-height: 1; }
      .nav .game-start { margin: 11px 9px; min-height: 48px; border: 1px solid #2c9ec9; border-radius: 4px; background: linear-gradient(180deg, #0d6387, #08415d); color: #fff; }
      .nav .game-start + a { border-left-color: transparent; }
      .nav .active { position: relative; color: var(--cyan); }
      .nav .active::after { content: ""; position: absolute; right: 18px; bottom: 0; left: 18px; height: 2px; background: var(--cyan); }

      main { height: calc(100% - 72px); padding: 24px 28px 14px; }
      .settings-shell { width: min(1180px, 100%); height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
      .page-heading { flex: 0 0 auto; margin: 0 0 12px; text-align: center; }
      .eyebrow { margin: 0 0 5px; color: #74c5e7; font-size: 11px; font-weight: 800; letter-spacing: .25em; }
      h1 { margin: 0; color: #fff; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 38px; font-weight: 600; letter-spacing: .18em; line-height: 1.15; }
      .settings-scroll { min-height: 0; flex: 1; overflow-y: hidden; padding: 14px 28px 16px; border: 1px solid var(--line); border-radius: 5px; background: linear-gradient(135deg, rgba(8, 31, 48, .92), rgba(4, 19, 31, .9)); }
      .settings-scroll::-webkit-scrollbar { width: 10px; }
      .settings-scroll::-webkit-scrollbar-thumb { border: 3px solid var(--panel-deep); border-radius: 10px; background: #31586f; }
      .setting-group + .setting-group { margin-top: 10px; }
      .group-title { display: flex; align-items: center; gap: 10px; margin: 0 0 5px; color: #f0f8fd; font-size: 14px; font-weight: 800; }
      .group-title::before { width: 2px; height: 17px; background: #7dd8f3; content: ""; }
      .group-note { margin: -2px 0 9px 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .setting-row {
        min-height: 52px; display: grid; grid-template-columns: minmax(168px, .8fr) minmax(430px, 1.35fr); gap: 24px; align-items: center;
        padding: 3px 16px; border: 1px solid var(--line); background: rgba(3, 16, 27, .52);
      }
      .setting-row + .setting-row { border-top: 0; }
      .setting-copy strong { display: block; color: #e8f5fc; font-size: 14px; }
      .setting-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
      .segmented { min-height: 44px; display: grid; border: 1px solid #315d77; border-radius: 3px; overflow: hidden; }
      .segmented.two { grid-template-columns: repeat(2, 1fr); }
      .segmented.three { grid-template-columns: repeat(3, 1fr); }
      .segmented button {
        min-width: 44px; min-height: 44px; border: 0; border-right: 1px solid #315d77; color: #cfe4ee; background: #071725;
        font-size: 13px; font-weight: 700;
      }
      .segmented button:last-child { border-right: 0; }
      .segmented button.selected { color: #fff; background: linear-gradient(180deg, #126b91, #0a4a68); box-shadow: inset 0 0 0 1px #42c9f8; }
      .toggle-line { min-height: 44px; display: flex; align-items: center; gap: 12px; }
      .toggle-button { min-width: 104px; min-height: 44px; padding: 0; border: 0; background: transparent; color: inherit; display: flex; align-items: center; gap: 12px; cursor: pointer; }
      .toggle { position: relative; width: 52px; height: 28px; flex: 0 0 auto; border: 1px solid #3b6b85; border-radius: 99px; background: #13283a; }
      .toggle::after { position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: #b6c8d4; content: ""; }
      .toggle.on { border-color: #59cff4; background: #0d668a; }
      .toggle.on::after { left: 28px; background: #f1fbff; }
      .toggle-label { color: #d8e7ef; font-size: 13px; font-weight: 700; }
      button:hover { filter: brightness(1.1); }
      button:active { transform: translateY(1px); }
      button:focus-visible, .nav a:focus-visible { outline: 2px solid #b9efff; outline-offset: 2px; }
      .range-row { min-height: 44px; display: grid; grid-template-columns: 1fr 46px; gap: 12px; align-items: center; }
      input[type="range"] { width: 100%; min-height: 44px; accent-color: #56cef5; }
      .range-value { min-width: 44px; min-height: 44px; display: grid; place-items: center; border: 1px solid #315d77; color: #daf1fb; font-size: 12px; font-weight: 800; }
      .reset-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 8px 0 0; }
      .reset-copy { color: var(--muted); font-size: 12px; line-height: 1.5; }
      .reset-copy strong { display: block; color: #dcebf4; font-size: 13px; }
      .reset { min-width: 184px; min-height: 44px; border: 1px solid #8b6971; border-radius: 4px; color: #ffdfe4; background: rgba(55, 25, 35, .34); font-size: 13px; font-weight: 800; }

      @media (max-width: 900px), (max-height: 600px) {
        .site-header { height: 54px; padding: 0 10px; }
        .brand { width: 145px; }
        .brand img { width: 130px; height: auto; }
        .nav { grid-template-columns: repeat(7, minmax(44px, 1fr)); }
        .nav a { min-width: 44px; min-height: 44px; gap: 3px; padding: 0 4px; font-size: 9px; }
        .nav-icon { font-size: 11px; }
        .nav .game-start { min-height: 44px; margin: 5px 4px; }
        .nav .active::after { right: 8px; left: 8px; }
        main { height: calc(100% - 54px); padding: 9px 12px 10px; }
        .settings-shell { width: 100%; }
        .page-heading { display: flex; align-items: baseline; gap: 9px; margin: 0 0 8px; padding-left: 4px; text-align: left; }
        .eyebrow { margin: 0; font-size: 9px; letter-spacing: .18em; }
        h1 { font-size: 21px; letter-spacing: .13em; }
        .settings-scroll { overflow-y: auto; padding: 12px 14px 16px; border-radius: 4px; }
        .setting-group + .setting-group { margin-top: 13px; }
        .group-title { margin-bottom: 6px; font-size: 13px; }
        .group-title::before { height: 15px; }
        .group-note { margin: -1px 0 6px 10px; font-size: 10px; }
        .setting-row { min-height: 54px; grid-template-columns: minmax(145px, .88fr) minmax(320px, 1.12fr); gap: 14px; padding: 5px 10px; }
        .setting-copy strong { font-size: 12px; }
        .setting-copy small { margin-top: 1px; font-size: 9px; }
        .segmented button { font-size: 11px; }
        .toggle-line { gap: 9px; }
        .toggle-label { font-size: 11px; }
        .range-row { gap: 8px; }
        .reset-row { padding-top: 11px; }
        .reset-copy { font-size: 10px; }
        .reset-copy strong { font-size: 11px; }
        .reset { min-width: 150px; font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header" aria-label="Main navigation">
      <div class="brand"><img src="../../../../../meta-app/src/assets/detective-conan-logo.png" alt="DETECTIVE CONAN CARD GAME" /></div>
      <nav class="nav" aria-label="Home Deck Cards Game Start Tutorial History Settings">
        <a href="#home" aria-label="Home"><span class="nav-icon">⌂</span><span>ホーム</span></a>
        <a href="#deck" aria-label="Deck"><span class="nav-icon">♧</span><span>デッキ</span></a>
        <a href="#cards" aria-label="Cards"><span class="nav-icon">▣</span><span>カード</span></a>
        <a class="game-start" href="#start" aria-label="Game Start"><span class="nav-icon">▶</span><span>ゲーム開始</span></a>
        <a href="#tutorial" aria-label="Tutorial"><span class="nav-icon">⌁</span><span>チュートリアル</span></a>
        <a href="#history" aria-label="History"><span class="nav-icon">◴</span><span>履歴</span></a>
        <a class="active" href="#settings" aria-current="page" aria-label="Settings"><span class="nav-icon">⚙</span><span>設定</span></a>
      </nav>
    </header>

    <main>
      <section class="settings-shell" aria-labelledby="settings-title">
        <div class="page-heading"><p class="eyebrow">SETTINGS</p><h1 id="settings-title">設定</h1></div>
        <div class="settings-scroll">
          <section class="setting-group" aria-labelledby="display-title">
            <h2 id="display-title" class="group-title">表示</h2>
            <div class="setting-row"><div class="setting-copy"><strong>表示密度</strong><small>カードと一覧の余白を調整します</small></div><div class="segmented two" aria-label="表示密度"><button aria-pressed="false">コンパクト</button><button class="selected" aria-pressed="true">標準</button></div></div>
          </section>

          <section class="setting-group" aria-labelledby="presentation-title">
            <h2 id="presentation-title" class="group-title">演出</h2>
            <div class="setting-row"><div class="setting-copy"><strong>演出速度</strong><small>対戦中の演出の進行速度</small></div><div class="segmented three" aria-label="演出速度"><button aria-pressed="false">遅い</button><button class="selected" aria-pressed="true">標準</button><button aria-pressed="false">速い</button></div></div>
            <div class="setting-row"><div class="setting-copy"><strong>画面シェイク</strong><small>重要な場面での画面の揺れ</small></div><div class="toggle-line"><button class="toggle-button" type="button" role="switch" aria-checked="true" aria-label="画面シェイク"><span class="toggle on" aria-hidden="true"></span><span class="toggle-label">有効</span></button></div></div>
            <div class="setting-row"><div class="setting-copy"><strong>効果音</strong><small>ゲーム内の効果音の音量</small></div><div class="range-row"><input aria-label="効果音の音量" type="range" min="0" max="100" value="70" /><span class="range-value">70</span></div></div>
          </section>

          <section class="setting-group" aria-labelledby="operation-title">
            <h2 id="operation-title" class="group-title">操作</h2>
            <div class="setting-row"><div class="setting-copy"><strong>操作の優先</strong><small>カードが重なる場面で優先する操作</small></div><div class="segmented two" aria-label="操作の優先"><button class="selected" aria-pressed="true">タップ＋ドラッグ</button><button aria-pressed="false">クリック</button></div></div>
            <div class="setting-row"><div class="setting-copy"><strong>自動パス</strong><small>選択肢がないとき、パスを提案します</small></div><div class="toggle-line"><button class="toggle-button" type="button" role="switch" aria-checked="false" aria-label="自動パス"><span class="toggle" aria-hidden="true"></span><span class="toggle-label">無効</span></button></div></div>
          </section>

          <section class="setting-group" aria-labelledby="accessibility-title">
            <h2 id="accessibility-title" class="group-title">アクセシビリティ</h2>
            <div class="setting-row"><div class="setting-copy"><strong>文字サイズ</strong><small>画面内の標準テキスト</small></div><div class="segmented three" aria-label="文字サイズ"><button aria-pressed="false">小</button><button class="selected" aria-pressed="true">標準</button><button aria-pressed="false">大</button></div></div>
            <div class="setting-row"><div class="setting-copy"><strong>コントラスト</strong><small>境界線と文字の見やすさ</small></div><div class="segmented two" aria-label="コントラスト"><button class="selected" aria-pressed="true">標準</button><button aria-pressed="false">高</button></div></div>
          </section>

          <section class="setting-group" aria-labelledby="reset-title">
            <h2 id="reset-title" class="group-title">保存とリセット</h2>
            <div class="reset-row"><div class="reset-copy"><strong>設定を初期値に戻す</strong>表示、演出、操作、アクセシビリティの設定を初期値に戻します。</div><button class="reset">初期値に戻す</button></div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
