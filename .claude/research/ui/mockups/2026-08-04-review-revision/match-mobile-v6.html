<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATCH mobile desktop-canvas v6 design mock</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020912; }
    .viewport { width: 851px; height: 393px; overflow: hidden; }
    .desktop-canvas {
      width: 1702px;
      height: 786px;
      transform: scale(.5);
      transform-origin: top left;
    }
    .desktop-reference { display: block; width: 1702px; height: 786px; }
  </style>
</head>
<body>
  <main class="viewport" aria-label="MATCH mobile: single uniformly scaled desktop canvas">
    <div class="desktop-canvas">
      <img class="desktop-reference" src="match-desktop-1702x786-runtime-reference-v6.png" alt="Complete desktop MATCH playmat and ACTIONS panel">
    </div>
  </main>
</body>
</html>
