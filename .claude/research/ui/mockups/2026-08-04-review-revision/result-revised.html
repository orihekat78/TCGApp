<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RESULT — Detective Conan Card Game</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f3f8ff;
        --muted: #9badc2;
        --line: rgba(142, 183, 223, .24);
        --line-strong: rgba(92, 194, 243, .55);
        --canvas: #020c17;
        --canvas-top: #05182a;
        --panel: rgba(5, 24, 41, .76);
        --cyan: #33c8ff;
        --violet: #b799ff;
        --success: #a7e8cf;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        overflow: hidden;
        color: var(--ink);
        font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background: radial-gradient(ellipse at 50% -15%, rgba(28,119,176,.22), transparent 47%), linear-gradient(180deg, var(--canvas-top), var(--canvas) 70%);
      }
      .site-header { height: 72px; display: flex; align-items: stretch; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(2,13,24,.80); }
      .brand { width: 251px; display: flex; align-items: center; flex: 0 0 auto; }
      .brand img { display: block; width: 192px; height: 42px; object-fit: contain; filter: brightness(0) invert(1); opacity: .94; }
      .nav { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(80px, 1fr)); }
      .nav a { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #d7e3ef; border-left: 1px solid rgba(132,168,201,.14); text-decoration: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
      .nav .icon { color: #c7d5e1; font-size: 17px; line-height: 1; }
      .nav a.active { margin: 11px 10px; min-height: 48px; border: 1px solid #3bd4ff; border-radius: 4px; color: #fff; background: linear-gradient(180deg, #0e83b2, #075779); box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), 0 0 16px rgba(39,191,255,.16); }
      .nav a.active + a { border-left-color: transparent; }

      main { height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; }
      .result-panel { width: 960px; height: 560px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: 1fr 86px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(8,38,64,.43), var(--panel) 21%, var(--panel) 79%, rgba(8,38,64,.43)); }
      .verdict { padding: 38px 28px 26px; border-right: 1px solid var(--line); }
      .eyebrow { margin: 0; color: #57baff; font-size: 12px; font-weight: 800; letter-spacing: .24em; }
      h1 { margin: 18px 0 3px; color: #fff; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 76px; font-weight: 500; letter-spacing: .12em; line-height: .95; text-shadow: 0 0 25px rgba(139,208,255,.24); }
      .outcome { margin: 0; color: var(--success); font-size: 14px; font-weight: 800; }
      .reason { margin: 32px 0 0; padding-top: 13px; border-top: 1px solid var(--line); color: #dce9f6; font-size: 14px; font-weight: 700; line-height: 1.65; }
      .reason span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .case-note { margin: 31px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

      .summary { padding: 34px 34px 16px; display: grid; grid-template-rows: auto auto 1fr; min-width: 0; }
      .summary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
      .summary-head h2 { margin: 0; color: #eaf5ff; font-size: 15px; letter-spacing: .08em; }
      .summary-head p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
      .evidence { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
      .side { padding: 16px 18px 16px 0; }
      .side + .side { padding-right: 0; padding-left: 22px; border-left: 1px solid var(--line); }
      .side-label { display: block; color: #5abaf5; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
      .side.opponent .side-label { color: var(--violet); }
      .score { display: flex; align-items: baseline; gap: 7px; margin-top: 4px; font-family: Georgia, "Yu Mincho", serif; }
      .score strong { color: #68c8ff; font-size: 40px; line-height: 1; }
      .opponent .score strong { color: var(--violet); }
      .score span { color: #eaf5ff; font-size: 18px; font-weight: 700; }
      .side small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
      .details { display: grid; grid-template-columns: 124px 1fr; align-content: start; }
      .detail-label { padding: 13px 14px 0 0; color: var(--muted); font-size: 11px; font-weight: 700; }
      .detail-value { padding: 13px 0 0; color: #eaf5ff; font-size: 13px; font-weight: 700; }
      .match-metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 15px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .metric { min-height: 63px; padding: 10px 14px; border-right: 1px solid var(--line); }
      .metric:last-child { border-right: 0; }
      .metric span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
      .metric strong { display: block; margin-top: 5px; color: #eff8ff; font-size: 17px; }
      .confirmed { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-top: 15px; color: var(--muted); font-size: 11px; }
      .card-mark { width: 23px; height: 32px; flex: 0 0 auto; border: 2px solid #bed2e5; border-radius: 3px; position: relative; transform: skewY(-7deg); }
      .card-mark::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(190,210,229,.65); }
      .confirmed strong { margin-left: 5px; color: #f4f8fc; font-size: 14px; }

      .actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 18px 32px; border-top: 1px solid var(--line); }
      .action { min-width: 210px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid #47647e; border-radius: 4px; color: #eaf5ff; background: rgba(5,25,43,.72); font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; }
      .action.primary { border-color: #42cffb; background: linear-gradient(180deg, #118ec0, #066c9c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 15px rgba(35,197,255,.12); }
      .action.disabled { min-width: 248px; flex-direction: column; gap: 2px; border-color: rgba(125,149,170,.35); color: #6f8193; background: rgba(10,25,39,.48); cursor: not-allowed; }
      .action.disabled small { color: #687d91; font-size: 10px; font-weight: 500; }

      @media (max-width: 900px), (max-height: 600px) {
        .site-header { height: 54px; padding: 0 10px; }
        .brand { width: 150px; }
        .brand img { width: 118px; height: auto; }
        .nav { grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .nav a { min-height: 44px; gap: 3px; font-size: 10px; }
        .nav .icon { font-size: 12px; }
        .nav a.active { min-height: 44px; margin: 5px 4px; }
        main { height: calc(100vh - 54px); display: block; padding: 8px 8px 0; }
        .result-panel { width: 835px; max-width: 100%; height: 323px; grid-template-columns: 144px minmax(0, 1fr) 228px; grid-template-rows: 1fr; background: linear-gradient(90deg, rgba(8,38,64,.48), var(--panel) 18%, var(--panel) 82%, rgba(8,38,64,.48)); }
        .verdict { padding: 21px 14px 12px; border-right: 1px solid var(--line); }
        .eyebrow { font-size: 10px; letter-spacing: .18em; }
        h1 { margin: 12px 0 2px; font-size: 52px; letter-spacing: .07em; }
        .outcome { font-size: 11px; }
        .reason { margin-top: 19px; padding-top: 8px; font-size: 11px; line-height: 1.5; }
        .reason span { margin-bottom: 2px; font-size: 10px; }
        .case-note { margin-top: 18px; font-size: 10px; line-height: 1.4; }
        .summary { padding: 18px 16px 11px; grid-column: 2; grid-row: 1; }
        .summary-head { gap: 8px; padding-bottom: 8px; }
        .summary-head h2 { font-size: 11px; }
        .summary-head p { font-size: 10px; }
        .side { padding: 10px 8px 10px 0; }
        .side + .side { padding-left: 10px; }
        .side-label { font-size: 10px; letter-spacing: .08em; }
        .score { gap: 4px; margin-top: 2px; }
        .score strong { font-size: 28px; }
        .score span { font-size: 13px; }
        .side small { margin-top: 2px; font-size: 10px; }
        .details { grid-template-columns: 88px 1fr; }
        .detail-label, .detail-value { padding-top: 8px; font-size: 10px; }
        .match-metrics { margin-top: 9px; }
        .metric { min-height: 46px; padding: 6px 7px; }
        .metric span { font-size: 10px; letter-spacing: 0; white-space: nowrap; }
        .metric strong { margin-top: 2px; font-size: 13px; }
        .confirmed { gap: 7px; margin-top: 9px; font-size: 10px; white-space: nowrap; }
        .card-mark { width: 16px; height: 22px; }
        .card-mark::after { inset: 2px; }
        .confirmed strong { margin-left: 3px; font-size: 11px; }
        .actions { grid-column: 3; grid-row: 1; flex-direction: column; align-items: stretch; justify-content: center; gap: 10px; padding: 0 16px; border-top: 0; border-left: 1px solid var(--line); }
        .action, .action.disabled { min-width: 0; min-height: 44px; font-size: 12px; }
        .action.disabled { min-height: 54px; }
        .action.disabled small { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header" aria-label="メインナビゲーション">
      <a class="brand" href="#home" aria-label="ホーム"><img src="../../../../../meta-app/src/assets/detective-conan-logo.png" alt="DETECTIVE CONAN" /></a>
      <nav class="nav" aria-label="主な画面">
        <a href="#home"><span class="icon">⌂</span><span>ホーム</span></a><a href="#deck"><span class="icon">▱</span><span>デッキ</span></a><a href="#cards"><span class="icon">▣</span><span>カード</span></a><a class="active" href="#setup"><span class="icon">▶</span><span>ゲーム開始</span></a><a href="#tutorial"><span class="icon">◌</span><span>チュートリアル</span></a><a href="#history"><span class="icon">◴</span><span>履歴</span></a><a href="#settings"><span class="icon">⚙</span><span>設定</span></a>
      </nav>
    </header>
    <main>
      <section class="result-panel" aria-labelledby="result-title" data-fixture="self-win-evidence-7">
        <section class="verdict" aria-label="勝敗">
          <p class="eyebrow">RESULT</p>
          <h1 id="result-title">勝利</h1>
          <p class="outcome">あなたの勝利</p>
          <p class="reason"><span>終了理由</span>証拠が必要数に到達</p>
          <p class="case-note">最後まで公開情報を確認して、結論に到達しました。</p>
        </section>
        <section class="summary" aria-label="対戦の要約">
          <div class="summary-head"><h2>対戦の要約</h2><p>12 ターン</p></div>
          <div class="evidence">
            <div class="side"><span class="side-label">YOU</span><div class="score"><strong>7</strong><span>/ 必要 7</span></div><small>現在の証拠</small></div>
            <div class="side opponent"><span class="side-label">CPU</span><div class="score"><strong>4</strong><span>/ 必要 7</span></div><small>現在の証拠</small></div>
          </div>
          <div class="details">
            <div class="detail-label">終了理由</div><div class="detail-value">証拠 7 / 7 を確認</div>
            <div class="detail-label">リフレッシュ</div><div class="detail-value">自分 1 回　/　相手 0 回</div>
            <div class="match-metrics" aria-label="対戦全体の記録"><div class="metric"><span>対戦全体・コンタクト</span><strong>3 回</strong></div><div class="metric"><span>対戦全体・ひらめき</span><strong>2 回</strong></div><div class="metric"><span>対戦全体・読み違い</span><strong>1 回</strong></div></div>
            <div class="confirmed"><span class="card-mark" aria-hidden="true"></span><span>勝利を確定したカード<strong>工藤新一</strong></span></div>
          </div>
        </section>
        <footer class="actions" aria-label="次の操作">
          <a class="action primary" href="#setup">もう一度対戦</a>
          <button class="action disabled" type="button" disabled aria-describedby="replay-note">リプレイを見る<small id="replay-note">準備中 — 対戦記録の保存後に利用できます</small></button>
        </footer>
      </section>
    </main>
  </body>
</html>
