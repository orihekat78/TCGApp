<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPLAY mobile headerless design mock</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020912; }
    body { color: #edf8ff; }
    .desktop { width: 100%; height: 100%; }
    .desktop img { display: block; width: 100%; height: 100%; object-fit: fill; }
    .mobile { display: none; }

    @media (max-width: 900px), (max-height: 560px) {
      .desktop { display: none; }
      .mobile {
        position: absolute; inset: 0; display: grid; grid-template-columns: 627px 200px; gap: 8px;
        width: 851px; height: 393px; padding: 8px; background: #020912;
      }
      .board {
        position: relative; min-width: 0; min-height: 0; overflow: hidden;
        border: 1px solid rgba(63, 190, 244, .66); border-radius: 3px; background: #06111f;
        box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
      }
      .board-image {
        position: absolute; left: -57px; top: -55px; width: 800px; height: 467px; max-width: none;
      }
      .remote {
        position: relative; min-width: 0; min-height: 0; padding: 8px; overflow: hidden;
        border: 1px solid #2f82ad; border-radius: 5px;
        background: linear-gradient(180deg, rgba(5, 20, 35, .98), rgba(5, 13, 25, .98));
        box-shadow: 0 8px 20px rgba(0, 0, 0, .42);
      }
      .remote-meta { display: flex; justify-content: space-between; align-items: center; height: 18px; color: #9cc5d8; font-size: 11px; font-weight: 800; }
      .remote-meta strong { color: #f1fbff; font-family: Consolas, monospace; }
      .current-event {
        height: 33px; margin-top: 3px; overflow: hidden; color: #d9effd;
        font-size: 11px; font-weight: 700; line-height: 15px;
      }
      .timing { display: grid; grid-template-columns: auto 1fr; gap: 7px; align-items: center; height: 22px; color: #d8eeff; font-size: 10px; font-weight: 800; }
      .progress-track { height: 5px; overflow: hidden; border-radius: 6px; background: #1a3045; }
      .progress-fill { width: 42%; height: 100%; background: #39c5ff; box-shadow: 0 0 8px #39c5ff; }
      .remote-controls { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 4px; }
      .remote-controls button {
        width: 100%; height: 50px; border: 1px solid #3a607f; border-radius: 4px;
        color: #edf8ff; background: linear-gradient(180deg, #17283d, #0b1727);
        font-size: 12px; font-weight: 800; letter-spacing: .02em;
      }
      .remote-controls .play {
        border-color: #2da3f1; color: #fff; background: linear-gradient(180deg, #15508a, #0b2c56);
        box-shadow: inset 0 0 0 1px rgba(35, 202, 255, .18);
      }
      .remote-controls .exit { color: #c9d8e5; }
      .speed-menu {
        position: absolute; z-index: 4; left: 8px; right: 8px; bottom: 59px; display: none;
        padding: 4px; border: 1px solid #3f9bc8; border-radius: 4px; background: #07182a;
        box-shadow: 0 10px 24px rgba(0, 0, 0, .55);
      }
      .speed-menu button {
        width: 100%; height: 44px; border: 0; border-bottom: 1px solid rgba(97, 167, 202, .22);
        color: #d8ebf5; background: transparent; font-size: 12px; font-weight: 800;
      }
      .speed-menu button:last-child { border-bottom: 0; }
      .speed-menu .selected { color: #031421; background: #45d0f4; }
      .remote.speed-open .speed-menu { display: block; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    }
  </style>
</head>
<body>
  <main class="desktop" aria-label="リプレイ デスクトップ参照">
    <img src="../2026-08-03-ui-refresh/replay-desktop-1440x900-concept.png" alt="リプレイ画面">
  </main>
  <main class="mobile" aria-label="ヘッダーを外したリプレイ モバイルデザインモック">
    <section class="board" aria-label="リプレイ盤面">
      <img class="board-image" src="../2026-08-03-ui-refresh/replay-desktop-1440x900-concept.png" alt="リプレイの盤面">
    </section>
    <aside class="remote" aria-label="リプレイ操作">
      <div class="remote-meta"><span id="replay-status">停止中</span><strong>手順 5 / 12</strong></div>
      <div class="current-event">CPUがカードを1枚引いた<br>デッキ → 手札 +1</div>
      <div class="timing"><span>00:05 / 00:18</span><div class="progress-track" aria-label="再生位置"><div class="progress-fill"></div></div></div>
      <div class="remote-controls">
        <button class="play" id="play-control">再生</button>
        <button>1件戻る</button>
        <button>1件進む</button>
        <button id="speed-control" aria-expanded="false">速度 1.0×　⌄</button>
        <button class="exit">リプレイを終了</button>
      </div>
      <div class="speed-menu" id="speed-menu" aria-label="再生速度">
        <button>0.5×</button><button class="selected">1.0×</button><button>2.0×</button><button>最速</button>
      </div>
    </aside>
  </main>
  <script>
    const state = new URLSearchParams(location.search).get('state');
    if (state === 'playing') {
      document.getElementById('replay-status').textContent = '再生中';
      document.getElementById('play-control').textContent = '一時停止';
    }
    if (state === 'speed') {
      document.querySelector('.remote').classList.add('speed-open');
      document.getElementById('speed-control').setAttribute('aria-expanded', 'true');
    }
  </script>
</body>
</html>
