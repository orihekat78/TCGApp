<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPLAY 横画面モバイル 改訂モック v3</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020912; }
    body { color: #edf8ff; }
    .desktop { width: 100%; height: 100%; }
    .desktop img { display: block; width: 100%; height: 100%; object-fit: fill; }
    .mobile { display: none; }

    @media (max-width: 900px), (max-height: 560px) {
      .desktop { display: none; }
      .mobile {
        display: grid; grid-template-rows: 54px 1fr; width: 851px; height: 393px;
        overflow: hidden; background: #020912;
      }
      .site-header {
        display: grid; grid-template-columns: 154px repeat(7, 1fr); align-items: stretch;
        border-bottom: 1px solid #1385bd; background: linear-gradient(180deg, #06111d, #04101a);
      }
      .brand { display: flex; align-items: center; padding-left: 11px; font-size: 15px; font-weight: 900; letter-spacing: -.04em; white-space: nowrap; }
      .brand small { display: block; margin-top: 1px; font-size: 5px; letter-spacing: .16em; }
      .nav-item { display: grid; place-items: center; min-width: 0; color: #d8ebf6; font-size: 9px; font-weight: 800; white-space: nowrap; }
      .nav-item.active { color: #fff; border: 1px solid #32bff4; border-bottom-color: #32bff4; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #1072a8, #073a68); box-shadow: inset 0 0 13px rgba(42, 202, 255, .16); }
      .nav-item.current { color: #69dbff; border-bottom: 2px solid #34c8ff; }
      .stage {
        display: grid; grid-template-columns: minmax(0, 1fr) 204px; gap: 6px;
        min-height: 0; padding: 7px 8px 8px;
      }
      .board {
        position: relative; min-width: 0; min-height: 0; overflow: hidden;
        border: 1px solid #2d8bc0; border-radius: 4px; background: #06111f;
        box-shadow: 0 7px 18px rgba(0,0,0,.44);
      }
      .board img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 44% 50%; }
      .remote {
        min-width: 0; min-height: 0; padding: 7px; overflow: hidden;
        border: 1px solid #2f92c4; border-radius: 5px; background: linear-gradient(180deg, #071a2c, #05101e);
        box-shadow: 0 7px 18px rgba(0,0,0,.44);
      }
      .remote-head { display: flex; align-items: center; justify-content: space-between; height: 14px; color: #a5d2e6; font-size: 9px; font-weight: 900; }
      .remote-head strong { color: #fff; font-family: Consolas, monospace; }
      .event { height: 25px; margin-top: 3px; overflow: hidden; color: #e7f6ff; font-size: 9px; font-weight: 800; line-height: 12px; }
      .progress-row { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: center; height: 16px; color: #cfeeff; font-size: 8px; font-weight: 800; }
      .progress { height: 4px; overflow: hidden; border-radius: 4px; background: #173349; }
      .progress > i { display: block; width: 42%; height: 100%; background: #36c5ff; box-shadow: 0 0 8px #36c5ff; }
      .controls { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 4px; }
      button { font: inherit; }
      .controls button { width: 100%; height: 42px; border: 1px solid #3d6d8e; border-radius: 4px; color: #edf8ff; background: linear-gradient(180deg, #162a40, #0b1728); font-size: 11px; font-weight: 900; }
      .controls .primary { border-color: #2eb6f1; background: linear-gradient(180deg, #15649d, #0b3968); box-shadow: inset 0 0 0 1px rgba(77, 217, 255, .16); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    }
  </style>
</head>
<body>
  <main class="desktop" aria-label="REPLAY デスクトップモック">
    <img src="../2026-08-03-ui-refresh/replay-desktop-1440x900-concept.png" alt="REPLAY画面">
  </main>
  <main class="mobile" aria-label="REPLAY 横画面モバイルモック">
    <header class="site-header">
      <div class="brand">DETECTIVE CONAN<small>CARD GAME</small></div>
      <div class="nav-item">⌂ ホーム</div><div class="nav-item">▱ デッキ</div><div class="nav-item">▣ カード</div>
      <div class="nav-item active">▶ ゲーム開始</div><div class="nav-item">◆ チュートリアル</div><div class="nav-item current">◉ 履歴</div><div class="nav-item">⚙ 設定</div>
    </header>
    <section class="stage">
      <section class="board" aria-label="リプレイのプレイマット"><img src="../2026-08-03-ui-refresh/replay-desktop-1440x900-concept.png" alt="デスクトップと同じプレイマット"></section>
      <aside class="remote" aria-label="リプレイ操作">
        <div class="remote-head"><span>リプレイ操作</span><strong>T5 / T12</strong></div>
        <div class="event">CPUがカードを1枚引いた — デッキ → 手札 +1</div>
        <div class="progress-row"><span>00:05 / 00:18</span><div class="progress"><i></i></div></div>
        <div class="controls">
          <button class="primary">再生／一時停止</button><button>1件戻る</button><button>1件進む</button><button>速度 1.0×</button><button>終了</button>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
